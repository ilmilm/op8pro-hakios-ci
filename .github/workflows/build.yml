# HakiOS for OnePlus 8 Pro (IN2020 / SM8250 kona) — CI
# Milestone 1: the oneplus8pro configuration (common kernel + sm8250 SoC layer + device fragment)
# compiles, and the open-profile kernel boots to `hello` under QEMU through HakiOS U-Boot.
name: hakios-oneplus8pro
on:
  workflow_dispatch:
  push:

jobs:
  qemu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout this CI repository (the loader patch)
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout HakiOS common
        uses: actions/checkout@v4
        with:
          repository: oosexgang/hakios-xnu-kernel
          ref: main
          path: hakios
          fetch-depth: 1

      - name: Checkout device port (oneplus8pro + sm8250 SoC layer)
        uses: actions/checkout@v4
        with:
          repository: ilmilm/hakios-oneplus8pro
          ref: main
          path: hakios/devices/oneplus8pro

      - name: Sync remaining device and uefi repositories
        run: |
          cd hakios
          python3 tools/hakios-device.py sync

      - name: Move uefi checkout to the u-boot branch
        # the manifest pins an older hakios-uefi revision whose u-boot files predate
        # `hakios load` setting hakios_start (cmd/hakios.c env_set); the qemu u-boot
        # flow needs the newer code from the upstream "u-boot" branch
        run: |
          cd hakios
          git -C uefi fetch origin u-boot
          git -C uefi checkout FETCH_HEAD

      - name: Apply the loader platform patch (instantnoodlep, fb 0x9C000000)
        run: |
          cd hakios
          git apply --check ../ci/xnuloader-instantnoodlep.patch
          git apply ../ci/xnuloader-instantnoodlep.patch

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld python3 git curl cpio xz-utils bc bison flex \
            gcc-aarch64-linux-gnu qemu-system-arm unzip uuid-dev llvm

      - name: Cache theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-linux-ubuntu-v2

      - name: Install theos (manual layout, cctools + iPhoneOS16.5.sdk)
        run: |
          set -e
          THEOS_DIR="$HOME/theos"
          if [ ! -f "$THEOS_DIR/Makefile" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS_DIR"
          fi
          if [ ! -x "$THEOS_DIR/toolchain/linux/iphone/bin/ld" ]; then
            rm -rf /tmp/tc && mkdir -p /tmp/tc "$THEOS_DIR/toolchain/linux/iphone"
            curl -fL -o /tmp/tc/tc.tar.xz "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-$(uname -m).tar.xz"
            tar -xJf /tmp/tc/tc.tar.xz -C /tmp/tc
            tar_root=/tmp/tc
            [ -d /tmp/tc/bin ] || tar_root=$(find /tmp/tc -maxdepth 4 -type d -name bin -printf '%h\n' | head -1)
            cp -a "$tar_root"/. "$THEOS_DIR/toolchain/linux/iphone/"
          fi
          if [ ! -d "$THEOS_DIR/sdks/iPhoneOS16.5.sdk" ]; then
            rm -rf /tmp/sdkrepo
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdkrepo
            git -C /tmp/sdkrepo sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p "$THEOS_DIR/sdks"
            mv /tmp/sdkrepo/iPhoneOS16.5.sdk "$THEOS_DIR/sdks/"
          fi
          test -x "$THEOS_DIR/toolchain/linux/iphone/bin/ld"
          test -d "$THEOS_DIR/sdks/iPhoneOS16.5.sdk"
          echo "THEOS=$THEOS_DIR" >> "$GITHUB_ENV"

      - name: Device defconfig (oneplus8pro)
        run: |
          cd hakios
          make oneplus8pro_defconfig
          make config

      - name: Kernel (XNU with sm8250 device configuration)
        run: |
          cd hakios
          make kernel JOBS=$(nproc)

      - name: Dump kernel build diagnostics (on failure)
        if: failure()
        run: |
          cd hakios
          for f in xnu-deps/exporthdrs.log xnu-deps/*.log; do
            [ -f "$f" ] && { echo "===== $f ====="; tail -60 "$f"; }
          done
          find xnu-src -name '*.log' 2>/dev/null | while read -r f; do
            echo "===== $f ====="; tail -40 "$f"
          done
          echo "===== MakeInc.kernel 120-140 ====="
          sed -n '120,140p' xnu-src/xnu-8796.121.2/makedefs/MakeInc.kernel 2>/dev/null
          echo "===== dsym tools ====="
          command -v dsymutil dwarfdump 2>/dev/null || echo "(no dsymutil/dwarfdump on PATH)"
          ls xnu-deps/host/bin 2>/dev/null
          ls "$THEOS/toolchain/linux/iphone/bin" 2>/dev/null | head -30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-failure-logs
          path: |
            hakios/xnu-deps/*.log
            hakios/logs/*
          if-no-files-found: ignore

      - name: Loader, open profile (placeholder identity)
        run: |
          cd hakios
          make loader-open

      - name: QEMU smoke through U-Boot (open kernel + hello)
        run: |
          cd hakios
          make qemu-u-boot SECS=30 JOBS=$(nproc) || true

      - name: Judge the smoke log
        run: |
          cd hakios
          echo "----- qemu-u-boot.log -----"
          cat logs/qemu-u-boot.log || true
          grep -q "XNULOADER" logs/qemu-u-boot.log && echo "::notice::loader banner seen"
          grep -q "Hello from user space on Darwin" logs/qemu-u-boot.log \
            && echo "::notice::HELLO OK — full chain to user space" \
            || { echo "::error::hello not reached"; exit 1; }

      - name: Package the phone payload (open profile)
        run: |
          cd hakios
          xnuloader/mkpayload.py -o payload-op8pro-open.bin kernel=hakios-kernel ramdisk=userland/hello \
            --cmdline "$(tools/hakios-config.py args)"
          sha256sum hakios-kernel payload-op8pro-open.bin

      - name: U-Boot for oneplus8pro + the fastboot boot image
        run: |
          cd hakios
          uefi/u-boot/build.sh oneplus8pro
          tools/mkubootimg.py -d oneplus8pro -p payload-op8pro-open.bin -o hakios-u-boot-oneplus8pro.img
          sha256sum u-boot/build-oneplus8pro/u-boot.bin hakios-u-boot-oneplus8pro.img

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hakios-op8pro-build
          path: |
            hakios/hakios-kernel
            hakios/payload-op8pro-open.bin
            hakios/hakios-u-boot-oneplus8pro.img
            hakios/logs/qemu-u-boot.log
          if-no-files-found: error
